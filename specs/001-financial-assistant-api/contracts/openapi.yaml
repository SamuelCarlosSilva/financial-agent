openapi: 3.1.0
info:
  title: Financial Agent API
  version: 1.0.0
  description: >
    Assistente financeiro conversacional. Estado da conversa é identificado exclusivamente
    por thread_id (API stateless). Perguntas fora do domínio financeiro são recusadas.
servers:
  - url: http://localhost:8000
security:
  - {}
  - ApiKeyAuth: []
paths:
  /v1/chat:
    post:
      summary: Envia uma mensagem ao assistente
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            examples:
              nova_conversa:
                value: { message: "Quanto está o dólar hoje?" }
              continuacao:
                value: { message: "E o euro?", thread_id: "3f6c2a3e-8a1b-4a53-9d7a-2f1d0c1b9e10" }
      responses:
        '200':
          description: Resposta do assistente (inclui recusas de escopo e pedidos de esclarecimento)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/threads/{thread_id}/messages:
    get:
      summary: Lista o histórico de mensagens (usuário/assistente) de uma thread
      operationId: getThreadMessages
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Histórico em ordem cronológica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Thread inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /health:
    get:
      summary: Verificação de saúde (liveness + conectividade com o banco)
      operationId: health
      security: []
      responses:
        '200':
          description: Saudável
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Dependência indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Exigido apenas se API_KEYS estiver configurado no servidor.
  responses:
    Unauthorized:
      description: X-API-Key ausente ou inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Entrada inválida (mensagem vazia, > 4000 caracteres, thread_id inválido)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Falha do provedor de LLM ou do banco (fontes de dados indisponíveis são tratadas com 200 + mensagem amigável)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: Não pode ser composta apenas de espaços.
        thread_id:
          type: string
          format: uuid
          description: >
            Omitir para iniciar nova conversa (o servidor gera o UUID). Um UUID válido ainda
            inexistente inicia uma nova conversa com esse identificador (idempotente para o cliente).
    ChatResponse:
      type: object
      required: [thread_id, answer, scope, sources]
      properties:
        thread_id: { type: string, format: uuid }
        answer: { type: string, description: Resposta em pt-BR }
        scope:
          type: string
          enum: [in_scope, out_of_scope, ambiguous]
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceCitation' }
    ThreadHistory:
      type: object
      required: [thread_id, messages]
      properties:
        thread_id: { type: string, format: uuid }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceCitation' }
    SourceCitation:
      oneOf:
        - $ref: '#/components/schemas/DocumentSource'
        - $ref: '#/components/schemas/FxQuoteSource'
        - $ref: '#/components/schemas/CalculationSource'
      discriminator:
        propertyName: type
        mapping:
          document: '#/components/schemas/DocumentSource'
          fx_quote: '#/components/schemas/FxQuoteSource'
          calculation: '#/components/schemas/CalculationSource'
    DocumentSource:
      type: object
      required: [type, document_id, title, source, snippet, score]
      properties:
        type: { const: document }
        document_id: { type: string }
        title: { type: string }
        source: { type: string }
        page: { type: [integer, 'null'] }
        snippet: { type: string, maxLength: 300 }
        score: { type: number }
    FxQuoteSource:
      type: object
      required: [type, pair, bid, ask, quoted_at, provider]
      properties:
        type: { const: fx_quote }
        pair: { type: string, pattern: '^[A-Z]{3}-[A-Z]{3}$' }
        bid: { type: string, description: Decimal serializado }
        ask: { type: string, description: Decimal serializado }
        quoted_at: { type: string, format: date-time }
        provider: { type: string }
    CalculationSource:
      type: object
      required: [type, expression, result]
      properties:
        type: { const: calculation }
        expression: { type: string }
        result: { type: string, description: Decimal serializado }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_error, not_found, unauthorized, upstream_unavailable] }
            message: { type: string }
            request_id: { type: string }
