# Cabeçalhos de segurança de todas as respostas (contracts/proxy.md). Incluído em cada
# location com add_header próprio, porque o Nginx não herda add_header do nível de cima.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
