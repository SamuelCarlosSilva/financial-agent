# As portas ficam só em 127.0.0.1: publicadas em 0.0.0.0, a API (sem chave por padrão) e o
# banco ficariam acessíveis a qualquer um na mesma rede, e o Docker passa por cima do firewall.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # dentro da rede do compose o banco é acessado pelo nome do serviço
      DATABASE_URL: postgresql://postgres:postgres@db:5432/financial_agent
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Front (Nginx): serve a interface em http://localhost:8080 e faz o proxy de /api para a API.
  # FINAGENT_API_KEY vem do .env da raiz e deve ser uma das API_KEYS (vazia se a API não exige
  # chave). Ela fica só no servidor: o Nginx a injeta nas chamadas, e o navegador nunca a vê.
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_UPSTREAM: http://api:8000
      FINAGENT_API_KEY: ${FINAGENT_API_KEY:-}
    depends_on:
      - api

  # Expurgo das threads inativas (retenção). Agendar diariamente, por exemplo:
  # 0 3 * * * docker compose --profile maintenance run --rm purge
  purge:
    build: .
    profiles: [maintenance]
    command: ["python", "-m", "financial_agent.maintenance.purge_threads"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/financial_agent
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
