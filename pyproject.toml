[project]
name = "financial-agent"
version = "0.1.0"
description = "Assistente financeiro conversacional via API REST (LangGraph + RAG + câmbio + calculadora)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-m 'not eval'"
filterwarnings = ["ignore:Relevance scores must be between 0 and 1"]
markers = [
    "eval: avaliações com o LLM real (custam tokens; rodar com -m eval)",
    "integration: testes que exigem Docker/Postgres (testcontainers)",
]

[tool.coverage.run]
source = ["financial_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Unitários + integração somavam 92% quando o limite foi definido; o CI falha se cair abaixo.
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_postgres.*", "testcontainers.*"]
ignore_missing_imports = true
