name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Rodar as avaliações com o LLM real (custam tokens)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # O piso de cobertura (fail_under) vale só para a soma das duas execuções, no passo
      # "Cobertura"; sozinhos, os unitários ficam abaixo dele.
      - name: Unitários e contrato
        run: >-
          uv run pytest -m "not eval and not integration" --junitxml=reports/unit.xml
          --cov --cov-report= --cov-fail-under=0
      - name: Integração (Postgres + pgvector via testcontainers)
        run: >-
          uv run pytest -m integration --junitxml=reports/integration.xml
          --cov --cov-append --cov-report=xml:reports/coverage.xml --cov-fail-under=0
      - name: Cobertura (unitários + integração)
        # Aplica o fail_under do pyproject sobre as duas execuções somadas. `shell: bash` liga o
        # pipefail, senão o tee esconderia a falha.
        shell: bash
        run: uv run coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  frontend:
    name: "Front: lint, tipos e testes"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          CI: true
      - name: Resumo da cobertura
        run: |
          node -e '
            const t = require("./reports/coverage/coverage-summary.json").total;
            const row = (k, n) => `| ${n} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Cobertura do front (Vitest)", "", "| Métrica | % | Cobertos |", "|---|---|---|",
              row("statements", "Statements"), row("branches", "Branches"),
              row("functions", "Functions"), row("lines", "Lines")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Build sem vazar a chave no bundle
        # Não use `! grep`: o bash ignora o errexit em comandos negados.
        run: |
          FINAGENT_API_KEY=ci-sentinel-7f3a npm run build
          if grep -rq "ci-sentinel-7f3a" dist/; then
            echo "::error::FINAGENT_API_KEY vazou para o bundle"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: frontend/reports/
          if-no-files-found: ignore

  frontend-e2e:
    name: "Front: E2E e acessibilidade"
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  docker-build:
    name: Build da imagem (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: finagent-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke do proxy Nginx (rotas, chave, cabeçalhos e re-resolução da API)
        if: matrix.name == 'web'
        run: scripts/proxy-smoke.sh finagent-web:ci

  eval:
    name: Avaliação com LLM real
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    needs: test
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financial_agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -m eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-failures
          path: tests/eval/out/
          if-no-files-found: ignore
